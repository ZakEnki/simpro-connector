name: Simpro Australia integration
on:
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment: simpro-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:integration
        env:
          SIMPRO_TEST_BASE_URL: ${{ secrets.SIMPRO_TEST_BASE_URL }}
          SIMPRO_TEST_COMPANY_ID: ${{ secrets.SIMPRO_TEST_COMPANY_ID }}
          SIMPRO_TEST_ACCESS_TOKEN: ${{ secrets.SIMPRO_TEST_ACCESS_TOKEN }}
