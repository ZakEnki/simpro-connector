services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: simpro, POSTGRES_PASSWORD: simpro, POSTGRES_DB: simpro}
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: .
    env_file: .env
    command: ['node','dist/apps/api/src/index.js']
    ports: ['3000:3000']
    depends_on: [postgres]
  worker:
    build: .
    env_file: .env
    command: ['node','dist/apps/worker/src/index.js']
    depends_on: [postgres]
volumes: {pgdata: {}}
